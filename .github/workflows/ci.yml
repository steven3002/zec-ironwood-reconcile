name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup show

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Release build
        run: cargo build --release

  offline-verification:
    name: Verification opens no socket
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup show

      - name: Install strace
        run: sudo apt-get update && sudo apt-get install -y strace

      - name: Release build
        run: cargo build --release

      # Produces target/offline-check/evidence.tar.zst for the trace below.
      - name: Build the check archive
        run: cargo test --test capture

      - name: Trace verification
        run: ./scripts/check-offline-verify.sh

  # The Linux-only matrix missed two defects that a single Windows run found, one of which
  # produced a different report hash from identical evidence. `macos-latest` is Apple Silicon,
  # so it also supplies the aarch64 coverage no other job provides.
  cross-platform:
    name: Reproduces the published hash on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup show

      # Asserts the committed bundle still reconciles to its published hash. The rest of the
      # suite only compares the tool against itself, which a consistently wrong platform passes.
      - name: Test
        run: cargo test --all-features

      - name: Release build
        run: cargo build --release

  supply-chain:
    name: Advisories and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  auditable-build:
    name: Release binary carries its dependency tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup show

      # `rust-audit-info` is the reader. The check builds twice on purpose, once without
      # the tree as a control, so both tools are needed before the build runs.
      - name: Install cargo-auditable and its reader
        run: cargo install cargo-auditable rust-audit-info --locked

      - name: Build and read back the embedded tree
        run: ./scripts/check-auditable-build.sh
