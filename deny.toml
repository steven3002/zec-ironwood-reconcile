[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licenses only. The project is released under MIT OR Apache-2.0 and must remain
# redistributable without copyleft obligations. Zero-knowledge proving crates historically
# carried the Bootstrap Open Source License; this crate verifies no proofs, so those crates
# should not appear in the graph at all. An unexpected license here is a design signal, not
# merely a compliance failure.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Public-domain dedication, more permissive than MIT. Reached through
    # zcash_script -> secp256k1. Accepted deliberately: CC0 grants no patent rights,
    # which is immaterial here because this crate performs no cryptographic operations
    # and redistributes no cryptographic implementation of its own.
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

# An async runtime indicates the sequential, rate-limited capture path has been replaced
# with something that does not need to be here.
deny = [{ name = "tokio" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
